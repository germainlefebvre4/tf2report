---
name: Pull Requests

on:
  pull_request:
    branches:
      - main
    # paths:
    #   - 'internal/**'
    #   - 'cmd/**'
    #   - 'go.mod'
    #   - 'go.sum'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Golang dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-go-rod
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.number }}-${{ hashFiles('go.sum') }}
          path: |
            ~/.cache/rod
            ~/go/pkg/

      - name: Build
        run: |
          go build -v -ldflags="-X 'github.com/germainlefebvre4/tf2report/cmd.appVersion=${{ github.sha }}'" -o tf2report ./main.go
          echo "Build completed."

      - name: Test with the Go CLI
        run: go test ./...

      - name: Test with tf2report
        run: |
          ./tf2report --version
          ./tf2report --help
